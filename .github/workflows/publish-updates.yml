name: Publish app update metadata

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      signer_sha256:
        required: false
        type: string
    secrets:
      UPDATE_SIGNING_KEY:
        required: true
      UPDATE_PUBLISH_TOKEN:
        required: false
      APK_SIGNER_SHA256:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published Release tag (also used for policy-only republish)
        required: true
        type: string
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["updates/policy.json", "updates/sources.json"]
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: app-update-metadata
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPDATE_PUBLISH_TOKEN || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install signing dependency
        run: python -m pip install cryptography==50.0.0
      - name: Verify APK/CDNs and atomically publish signed metadata
        env:
          GH_TOKEN: ${{ secrets.UPDATE_PUBLISH_TOKEN || github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          APK_SIGNER_SHA256: ${{ inputs.signer_sha256 || secrets.APK_SIGNER_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/publish_app_update.py --tag "$RELEASE_TAG" --publish
          else
            python scripts/publish_app_update.py --maintain --publish
          fi
