name: Build APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      changed: ${{ steps.version.outputs.changed }}
      build_type: ${{ steps.version.outputs.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Automatic releases need tags and history for version detection/notes.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Read version and detect version update
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          read_version_code() {
            sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' | head -n 1
          }

          read_version_name() {
            sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -n 1
          }

          VERSION_CODE=$(read_version_code < app/build.gradle.kts)
          VERSION_NAME=$(read_version_name < app/build.gradle.kts)

          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "Unable to read versionCode/versionName from app/build.gradle.kts." >&2
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]] ||
             [[ ! "$VERSION_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "Version must have a numeric code and a filename-safe name." >&2
            exit 1
          fi

          VERSION_CHANGED=false
          if [ "$EVENT_NAME" = "push" ] &&
             ! git rev-parse -q --verify "refs/tags/${VERSION_CODE}" >/dev/null; then
            VERSION_CHANGED=true
          fi

          BUILD_TYPE=debug
          if [ "$VERSION_CHANGED" = "true" ]; then
            BUILD_TYPE=release
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BUILD_TYPE="$REQUESTED_BUILD_TYPE"
          fi
          if [[ "$BUILD_TYPE" != "debug" && "$BUILD_TYPE" != "release" ]]; then
            echo "Unsupported build type." >&2
            exit 1
          fi

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: github.event_name == 'push' && steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t VERSION_COMMITS < <(
            git log \
              --format='%H' \
              --extended-regexp \
              -G '^[[:space:]]*version(Code|Name)[[:space:]]*=' \
              -- app/build.gradle.kts
          )

          CURRENT_VERSION_COMMIT="${VERSION_COMMITS[0]:-}"
          PREVIOUS_VERSION_COMMIT="${VERSION_COMMITS[1]:-}"

          if [ -z "$CURRENT_VERSION_COMMIT" ]; then
            echo "No commit changing versionCode/versionName was found." >&2
            exit 1
          fi

          if [ -n "$PREVIOUS_VERSION_COMMIT" ]; then
            RELEASE_RANGE="${PREVIOUS_VERSION_COMMIT}..${CURRENT_VERSION_COMMIT}"
          else
            RELEASE_RANGE="$CURRENT_VERSION_COMMIT"
          fi

          git log \
            --reverse \
            --format='- %s' \
            "$RELEASE_RANGE" > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No commit messages were found for release notes." >&2
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 22

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          # Also save dependency/task caches for manual builds on trusted branches.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check Android and build APK
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
        # Run the checks and packaging together to reuse this runner's task outputs.
        run: |
          ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug \
            ":app:assemble${BUILD_TYPE^}" --no-configuration-cache --console=plain

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: check-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: steps.version.outputs.build_type == 'debug'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: CaiXiaoTong-${{ steps.version.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 1

      - name: Prepare release input
        if: steps.version.outputs.build_type == 'release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-input
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-input/
          if [ -f release-notes.md ]; then
            cp release-notes.md release-input/
          fi

      - name: Upload release input
        if: steps.version.outputs.build_type == 'release'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-input
          path: release-input/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: needs.build.outputs.build_type == 'release' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download checked release input
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-input
          path: release-input

      - name: Sign release APK
        id: sign
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEY" ] || [ -z "$ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Release requires SIGNING_KEY, ALIAS and KEYSTORE_PASSWORD secrets." >&2
            exit 1
          fi

          UNSIGNED_APK=release-input/app-release-unsigned.apk
          OUT_NAME="CaiXiaoTong-${VERSION_NAME}-release.apk"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          umask 077
          SIGNING_FILE=$(mktemp "$RUNNER_TEMP/signing-XXXXXX.jks")
          trap 'rm -f -- "$SIGNING_FILE"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$SIGNING_FILE"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED_APK" "./$OUT_NAME"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$SIGNING_FILE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            "./$OUT_NAME"
          "$BUILD_TOOLS/apksigner" verify --verbose "./$OUT_NAME"

          echo "apk=$OUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.sign.outputs.apk }}
          path: ./${{ steps.sign.outputs.apk }}
          archive: false
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && needs.build.outputs.changed == 'true'
        uses: ncipollo/release-action@v1.21.0
        with:
          token: ${{ github.token }}
          tag: ${{ needs.build.outputs.version_code }}
          commit: ${{ github.sha }}
          name: ${{ needs.build.outputs.version_name }}
          bodyFile: release-input/release-notes.md
          artifacts: ./${{ steps.sign.outputs.apk }}
          artifactErrorsFailBuild: true
          makeLatest: true
