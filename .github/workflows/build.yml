name: Build APK

on:
  push:
    branches: [main, beta]
    paths-ignore: ["updates/stable/**", "updates/beta/**", "updates/policy.json", "updates/sources.json", "docs/**", "*.md"]
  pull_request:
    branches: [main, beta]
    paths-ignore: ["updates/stable/**", "updates/beta/**", "updates/policy.json", "updates/sources.json", "docs/**", "*.md"]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type (manual builds do not publish a Release)
        required: true
        default: debug
        type: choice
        options: [debug, release]

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Update the release PR or create its draft Release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.ref_name }}
          config-file: ${{ github.ref_name == 'beta' && 'release-please-config-beta.json' || 'release-please-config.json' }}
          manifest-file: ${{ github.ref_name == 'beta' && '.release-please-manifest-beta.json' || '.release-please-manifest.json' }}

  build:
    needs: release-please
    if: always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      channel: ${{ steps.version.outputs.channel }}
      build_type: ${{ steps.version.outputs.build_type }}
      publish: ${{ steps.version.outputs.publish }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      reused: ${{ steps.existing.outputs.reused }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare the version shared by both channels
        id: version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
          REQUESTED_BUILD_TYPE: ${{ inputs.build_type }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_build_version.py --release-tag "$RELEASE_TAG"
      - name: Reuse an already published APK on retries
        id: existing
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p release-input
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets | map(select(.name | endswith(".apk"))) | length' > apk-count.txt 2>/dev/null; then
            COUNT=$(cat apk-count.txt)
            if [ "$COUNT" -gt 1 ]; then
              echo "Release contains multiple APKs; refusing to choose or replace one." >&2
              exit 1
            fi
            if [ "$COUNT" = 1 ]; then
              gh release download "$RELEASE_TAG" --pattern '*.apk' --dir release-input
              test -f "release-input/CaiXiaoTong-${VERSION_NAME}-release.apk"
              echo 'reused=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Prepare release notes
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-input
          gh release view "$RELEASE_TAG" --json body --jq '.body' > release-input/release-notes.md
      - uses: actions/setup-java@v6.0.1
        if: steps.existing.outputs.reused != 'true'
        with:
          distribution: temurin
          java-version: 22
      - uses: gradle/actions/setup-gradle@v6.3.0
        if: steps.existing.outputs.reused != 'true'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build APK
        if: steps.existing.outputs.reused != 'true'
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.version.outputs.build_type }}
          APP_BUILD_VERSION_FILE: build-version.properties
          PANGGUI_API_SECRET: ${{ github.event_name != 'pull_request' && secrets.PANGGUI_API_SECRET || '' }}
          HUI798_SIGN_SALT: ${{ github.event_name != 'pull_request' && secrets.HUI798_SIGN_SALT || '' }}
          HUI798_API_GATEWAY: ${{ github.event_name != 'pull_request' && secrets.HUI798_API_GATEWAY || '' }}
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = release ] && [ -z "$HUI798_SIGN_SALT" ]; then
            echo "Release requires the HUI798_SIGN_SALT repository secret." >&2
            exit 1
          fi
          if [ -z "$HUI798_API_GATEWAY" ]; then unset HUI798_API_GATEWAY; fi
          chmod +x gradlew
          ./gradlew ":app:assemble${BUILD_TYPE^}" --no-configuration-cache --console=plain
      - name: Upload debug APK
        if: steps.version.outputs.build_type == 'debug'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: CaiXiaoTong-${{ steps.version.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 1
      - name: Prepare release input
        if: steps.version.outputs.build_type == 'release'
        shell: bash
        env:
          REUSED: ${{ steps.existing.outputs.reused }}
        run: |
          set -euo pipefail
          mkdir -p release-input
          if [ "$REUSED" != true ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-input/
            cp build-metadata.json release-input/
          fi
      - name: Upload release input
        if: steps.version.outputs.build_type == 'release'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-input
          path: release-input/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: needs.build.outputs.build_type == 'release' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      signer_sha256: ${{ steps.sign.outputs.signer_sha256 }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-input
          path: release-input
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 22
      - name: Sign or verify the release APK
        id: sign
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          REUSED: ${{ needs.build.outputs.reused }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" && test -n "$ALIAS" && test -n "$KEYSTORE_PASSWORD"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          OUT_NAME="CaiXiaoTong-${VERSION_NAME}-release.apk"
          umask 077
          SIGNING_FILE=$(mktemp "$RUNNER_TEMP/signing-XXXXXX.jks")
          CERT_FILE=$(mktemp "$RUNNER_TEMP/certificate-XXXXXX.der")
          trap 'rm -f -- "$SIGNING_FILE" "$CERT_FILE"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$SIGNING_FILE"
          keytool -exportcert -keystore "$SIGNING_FILE" -alias "$ALIAS" -storepass:env KEYSTORE_PASSWORD -file "$CERT_FILE"
          EXPECTED=$(sha256sum "$CERT_FILE" | cut -d ' ' -f1)
          if [ "$REUSED" = true ]; then
            cp "release-input/$OUT_NAME" "./$OUT_NAME"
          else
            "$BUILD_TOOLS/zipalign" -f 4 release-input/app-release-unsigned.apk "./$OUT_NAME"
            "$BUILD_TOOLS/apksigner" sign --ks "$SIGNING_FILE" --ks-key-alias "$ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD "./$OUT_NAME"
          fi
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "./$OUT_NAME" > signing-report.txt
          ACTUAL=$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+(\.[0-9]+)* Signer( #[0-9]+)?):? certificate SHA-256 digest: ([a-fA-F0-9]{64})$/\4/p' signing-report.txt | tr 'A-F' 'a-f' | sort -u)
          test "$ACTUAL" = "$EXPECTED"
          echo "apk=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Upload signed APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.sign.outputs.apk }}
          path: ./${{ steps.sign.outputs.apk }}
          archive: false
          if-no-files-found: error
      - name: Publish the Release without replacing existing APKs
        if: needs.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          APK: ${{ steps.sign.outputs.apk }}
          REUSED: ${{ needs.build.outputs.reused }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable) PRERELEASE=false ;;
            beta) PRERELEASE=true ;;
            *) echo "Unknown release channel." >&2; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$REUSED" != true ]; then
              gh release upload "$RELEASE_TAG" "./$APK" release-input/build-metadata.json
            fi
            gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest=false
          else
            echo "Releases must originate from a Release Please PR." >&2
            exit 1
          fi

  publish-updates:
    needs: [build, release]
    if: needs.build.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-updates.yml
    with:
      release_tag: ${{ needs.build.outputs.release_tag }}
      signer_sha256: ${{ needs.release.outputs.signer_sha256 }}
    secrets:
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      UPDATE_PUBLISH_TOKEN: ${{ secrets.UPDATE_PUBLISH_TOKEN }}
      APK_SIGNER_SHA256: ${{ secrets.APK_SIGNER_SHA256 }}
